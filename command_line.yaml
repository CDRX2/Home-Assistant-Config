# Web checks of Docker containers on the Docker VM, used by the screensaver alerts
# (sensors/screensaver.yaml, docker_direct / docker_via_npm).
# The commands (with addresses) are in secrets.yaml: web_check_<name>. Repo is public.
# on  = the service answered with an HTTP status below 500 (a login page or 401 counts as up)
# off = no answer, or 5xx (NPM returns 502 when the container behind it is down)

# Nginx Proxy Manager, direct (admin UI)
- binary_sensor:
    name: Web NPM
    unique_id: web_check_npm
    command: !secret web_check_npm
    value_template: "{{ 'on' if 0 < value | int(0) < 500 else 'off' }}"
    payload_on: "on"
    payload_off: "off"
    device_class: connectivity
    scan_interval: 60

