    #########################    Mini Weather card    #########################

  - type: custom:atmospheric-weather-card
    weather_entity: weather.openweathermap
    sun_entity: sun.sun
    theme_entity: sun.sun
    card_height: 10vw
    card_padding: 0px
    celestial_size: 0.1vw
    celestial_position: fixed
    celestial_alignment: left
    celestial_x: 45
    celestial_y: center
    chip_area_position: top-left
    chip_text_size: 0.6vw
    chip_padding: 0.8vw 0.2vw
    chip_gap: 0.1vw
    card_tap_action:
      action: navigate
      navigation_path: /lovelace-visual/weather
    custom_cards_position: bottom-center
    chips:
      - entity: weather.openweathermap
        attribute: temperature
        position: custom
        position_anchor: left
        position_x: 0
        position_y: 0
        text_size: 3vw
        background: false
        padding: 0px 0.2vw
        hide_icon: true
        hide_label: true
        fancy_unit: true
        value_weight: "600"
        behind_effects: false
      - entity: weather.openweathermap
        attribute: humidity
        name: HMD
        background: false
      - entity: weather.openweathermap
        attribute: wind_speed
        name: Wind
        background: false
      - entity: sensor.openweathermap_pressure
        background: false
      - forecast: daily
        attribute: temperature
        entity: weather.openweathermap
        forecast_offset: 1
        background: false
    grid_options:
      rows: auto
    custom_cards:
        - type: custom:mini-graph-card
          entities:
            - sensor.openweathermap_temperature
            - sensor.temperature_salon
          show:
            icon: false
            legend: false
            name: false
            state: false
            points: false
          decimals: 1
          color_thresholds:
            - color: '#03a8f4'
              value: 10
            - color: '#ffa31a'
              value: 20
            - color: '#ff1a1a'
              value: 30
          hour24: true
          points_per_hour: 1
          custom_width: 100%
          card_mod:
            style: |
              ha-card {
                background: none !important;
              }
    card_mod:
      style: |
        :host {
          left: 50%;
          top: 92%;
        }


    #########################    Overlay shadow images    #########################

  - action: none
    image: /local/ui/sidebar/sideShadow.png
    style:
      height: 20%
      left: 80%
      pointer-events: none
      top: 90%
      width: 40%
    type: image
  - action: none
    image: /local/ui/sidebar/sidebarInnerShadow.png
    style:
      left: 97.5%
      opacity: 0.7
      pointer-events: none
      top: 50%
      width: 5%
      height: 100%
    type: image

    #########################   Styled now playing media button    #########################

    # when the media player is playing, this overlaps the "Media" menu button

  - type: conditional
    conditions:
      - entity: sensor.remote_select
        state: music
      - entity: media_player.sc_lx78
        state_not: idle
    elements:
      - type: image
        image: /local/ui/sidebar/sidebarBG.png
        style:
          width: 88%
          height: 10%
          left: 50%
          top: 35%
      - type: 'custom:button-card'
        template: media_sidebar_state
        entity: media_player.sc_lx78
        state_display: >
          [[[
            if (entity) {
              let elt = this.shadowRoot,
                await = setTimeout(marquee, 0),
                artist = entity.attributes.media_artist,
                title = entity.attributes.media_title,
                output = artist === undefined && title !== undefined
                  ? title
                  : title === undefined && artist !== undefined
                    ? artist
                    : title !== undefined && artist !== undefined
                      ? `${artist} - ${title}`
                      : variables.translate_idle;
              function marquee() {
                let state = elt.getElementById("state"),
                  container = elt.getElementById("container");
                if (state && container) {
                  state.innerHTML = output;
                  let ro = new ResizeObserver(entries => {
                    let spacer = "&nbsp;".repeat(3),
                      s = entries[0],
                      c = entries[1],
                      r = s && s.contentRect &&
                          c && c.contentRect &&
                          s.contentRect.width !== 0 &&
                          c.contentRect.width !== 0;
                    if (r && s.contentRect.width < c.contentRect.width) {
                      state.classList.remove("marquee");
                    }
                    else if (r && s.contentRect.width >= c.contentRect.width) {
                      state.innerHTML = `${output} ${spacer} ${output} ${spacer}&nbsp;`;
                      state.classList.add("marquee");
                    }
                  });
                  ro.observe(state);
                  ro.observe(container);
                }
              }
              return output;
            }
            return variables.translate_unknown;
          ]]]
